<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Rabbithole — Papers MVP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      font-family: system-ui, Arial;
      max-width: 820px;
      margin: 32px auto;
      padding: 0 16px;
      color: #111;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
    }
    textarea, input {
      width: 100%;
      padding: 8px;
      font-family: inherit;
    }
    textarea {
      min-height: 140px;
    }
    button {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #ff6f61;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    pre {
      background: #f6f6f6;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>Rabbithole — Papers MVP</h1>
  <p>Paste an abstract or enter an arXiv ID.</p>

  <label>arXiv ID (optional)</label>
  <input id="arxivId" placeholder="e.g. 1706.03762" />

  <label>Paper title (optional)</label>
  <input id="title" placeholder="Paper title" />

  <label>Abstract / Text</label>
  <textarea id="text" placeholder="Paste abstract or paper text here"></textarea>

  <button onclick="analyze()">Analyze paper</button>

  <h2>Result</h2>
  <div id="result">No result yet</div>

<script>
const BACKEND = "http://localhost:3000";

async function analyze() {
  document.getElementById("result").innerText = "Analyzing…";

  const payload = {
    title: document.getElementById("title").value.trim(),
    arxivId: document.getElementById("arxivId").value.trim(),
    text: document.getElementById("text").value.trim()
  };

  try {
    const res = await fetch(BACKEND + "/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const json = await res.json();
    document.getElementById("result").innerHTML =
      "<pre>" + JSON.stringify(json, null, 2) + "</pre>";
  } catch (e) {
    document.getElementById("result").innerText =
      "Error: " + e.message;
  }
}
</script>
</body>
</html>
