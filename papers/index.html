<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RabbitHole Papers - Analyze Scientific Papers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1em;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin-top: 20px;
        }

        .error {
            color: #e74c3c;
            padding: 12px;
            background: #fadbd8;
            border-radius: 5px;
            margin-top: 15px;
        }

        .result-section {
            margin-top: 20px;
        }

        .level-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .level-1 { background: #2ecc71; }
        .level-2 { background: #27ae60; }
        .level-3 { background: #3498db; }
        .level-4 { background: #2980b9; }
        .level-5 { background: #9b59b6; }
        .level-6 { background: #8e44ad; }
        .level-7 { background: #e74c3c; }
        .level-8 { background: #c0392b; }
        .level-9 { background: #d35400; }
        .level-10 { background: #a93226; }

        .result-item {
            margin-bottom: 20px;
        }

        .result-item-label {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .result-item-content {
            color: #333;
            line-height: 1.6;
        }

        .concepts-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .concept-tag {
            background: #f0f0f0;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            color: #333;
        }

        .recommendation {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }

        .recommendation-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 3px;
        }

        .recommendation-text {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>?? RabbitHole Papers</h1>
            <p class="subtitle">Analyze scientific papers and find your learning path</p>
        </header>

        <div class="content">
            <!-- Input Section -->
            <div class="card">
                <h2>Enter Paper</h2>
                <div>
                    <input
                        type="text"
                        id="title"
                        placeholder="Paper title (e.g., 'Attention Is All You Need')"
                    >
                    <textarea
                        id="text"
                        placeholder="Paste the paper text here... (abstract, introduction, or key sections)"
                    ></textarea>
                    <button id="analyzeBtn" onclick="analyzePaper()">
                        Analyze Paper
                    </button>
                    <div id="loading" class="loading" style="display: none;">
                        Analyzing... please wait
                    </div>
                    <div id="error" class="error" style="display: none;"></div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="card">
                <h2>Analysis Result</h2>
                <div id="results" style="display: none;">
                    <div id="levelBadge"></div>

                    <div class="result-item">
                        <div class="result-item-label">Why this level</div>
                        <div class="result-item-content" id="levelReason"></div>
                    </div>

                    <div class="result-item">
                        <div class="result-item-label">Summary</div>
                        <div class="result-item-content" id="summary"></div>
                    </div>

                    <div class="result-item">
                        <div class="result-item-label">Key Concepts</div>
                        <div class="concepts-list" id="conceptsList"></div>
                    </div>

                    <div class="result-item">
                        <div class="result-item-label">Learning Path</div>
                        <div id="prerequisite" class="recommendation">
                            <div class="recommendation-label">?? Prerequisite</div>
                            <div class="recommendation-text" id="prerequisiteText"></div>
                        </div>
                        <div id="easier" class="recommendation">
                            <div class="recommendation-label">?? Start Here (Easier)</div>
                            <div class="recommendation-text" id="easierText"></div>
                        </div>
                        <div id="deeper" class="recommendation">
                            <div class="recommendation-label">?? Go Deeper</div>
                            <div class="recommendation-text" id="deeperText"></div>
                        </div>
                    </div>
                </div>
                <div id="placeholder" style="color: #999; text-align: center; padding: 40px;">
                    Results will appear here
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        async function analyzePaper() {
            const title = document.getElementById('title').value.trim();
            const text = document.getElementById('text').value.trim();
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');
            const placeholderDiv = document.getElementById('placeholder');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!title || !text) {
                errorDiv.textContent = 'Please enter both title and text';
                errorDiv.style.display = 'block';
                return;
            }

            const analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.disabled = true;
            loadingDiv.style.display = 'block';
            resultsDiv.style.display = 'none';
            placeholderDiv.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, text }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Analysis failed');
                }

                const result = await response.json();
                displayResults(result);
                placeholderDiv.style.display = 'none';
                resultsDiv.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.style.display = 'block';
            } finally {
                analyzeBtn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        }

        function displayResults(result) {
            const level = result.level;
            document.getElementById('levelBadge').innerHTML =
                `<span class="level-badge level-${level}">Level ${level}/10</span>`;
            document.getElementById('levelReason').textContent = result.level_reason;
            document.getElementById('summary').textContent = result.summary;

            const conceptsList = document.getElementById('conceptsList');
            conceptsList.innerHTML = result.concepts
                .map(c => `<span class="concept-tag">${escapeHtml(c)}</span>`)
                .join('');

            document.getElementById('prerequisiteText').textContent = result.prerequisite;
            document.getElementById('easierText').textContent = result.easier;
            document.getElementById('deeperText').textContent = result.deeper;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key in text area but not submit
        document.getElementById('text').addEventListener('keydown', function (e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '\t' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 1;
            }
        });
    </script>
</body>
</html>
