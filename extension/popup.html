<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RabbitHole Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff; color: #333;
    }
    .header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 16px 18px; display: flex; align-items: center; gap: 10px;
    }
    .header-title { font-size: 16px; font-weight: 700; color: #fff; }
    .header-sub   { font-size: 11px; color: rgba(255,255,255,0.75); }
    .body { padding: 16px 18px; }
    .note { font-size: 11px; color: #888; margin-bottom: 14px; line-height: 1.5; }
    label {
      display: block; font-size: 11px; font-weight: 600; color: #555;
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px;
    }
    label span { font-weight: 400; color: #aaa; text-transform: none; }
    label a { color: #667eea; text-decoration: none; }
    label a:hover { text-decoration: underline; }
    .key-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .key-row input {
      flex: 1; padding: 8px 10px; border: 1.5px solid #d4d8f0;
      border-radius: 8px; font-size: 12px; font-family: monospace; outline: none;
      transition: border-color .15s;
    }
    .key-row input:focus { border-color: #667eea; }
    .key-row input.saved { border-color: #48bb78; background: #f0fff4; }
    .vis-btn {
      padding: 8px 10px; border: 1.5px solid #d4d8f0; border-radius: 8px;
      background: #f8f8ff; cursor: pointer; font-size: 13px; color: #667eea;
    }
    .vis-btn:hover { background: #eef0fb; }
    .save-btn {
      width: 100%; padding: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .save-btn:hover { opacity: .9; }
    .save-btn:disabled { opacity: .5; cursor: default; }
    .status { margin-top: 10px; font-size: 12px; text-align: center; min-height: 18px; color: #48bb78; font-weight: 600; }
    .status.error { color: #e53e3e; }
    hr { border: none; border-top: 1px solid #eee; margin: 14px 0; }
    .info-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #888; }
    .info-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .info-dot.active { background: #48bb78; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size:22px;">🐇</span>
    <div>
      <div class="header-title">RabbitHole</div>
      <div class="header-sub">API Key Settings</div>
    </div>
  </div>

  <div class="body">
    <p class="note">
      Click the toolbar icon to open the panel and analyze pages.<br />
      Keys are stored locally — never leave your browser.
    </p>

    <label for="gemini-key">
      Gemini API Key <span>· primary · <a href="https://aistudio.google.com/apikey" target="_blank">get free key</a></span>
    </label>
    <div class="key-row">
      <input type="password" id="gemini-key" placeholder="AIza…" autocomplete="off" spellcheck="false" />
      <button class="vis-btn" id="toggle-gemini">👁</button>
    </div>

    <label for="groq-key">
      Groq API Key <span>· fallback · <a href="https://console.groq.com/keys" target="_blank">get free key</a></span>
    </label>
    <div class="key-row">
      <input type="password" id="groq-key" placeholder="gsk_…" autocomplete="off" spellcheck="false" />
      <button class="vis-btn" id="toggle-groq">👁</button>
    </div>

    <button class="save-btn" id="save-btn">Save Keys</button>
    <div class="status" id="status"></div>

    <hr />
    <div class="info-row">
      <div class="info-dot" id="status-dot"></div>
      <span id="status-label">No API keys set</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
